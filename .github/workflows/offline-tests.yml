name: Offline regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: offline-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out proposed code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Restore checksum-verified FDA source
        env:
          FDA_STARTER_ZIP_BASE64: ${{ secrets.FDA_STARTER_ZIP_BASE64 }}
        run: python scripts/prepare_ci_source.py

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run permitted offline regression tests
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          --ignore=tests/test_inventory_loader.py
          --ignore=tests/test_inventory_store.py
          --ignore=tests/test_a2_agent.py
          --ignore=tests/test_a2_review_fixes.py

      - name: Record test scope
        if: always()
        run: |
          printf '%s\n' \
            '## Offline regression scope' \
            'FDA source and generated synthetic inventory tests; external responses are simulated.' \
            '21 tests in four frozen-inventory-dependent modules are outside this selection.' \
            'No live OpenAI/Qdrant calls, held-out labels, caches, or uploaded test artifacts.' \
            >> "$GITHUB_STEP_SUMMARY"
